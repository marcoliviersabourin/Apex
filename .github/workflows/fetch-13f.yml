name: Fetch 13F Holdings

# Runs weekly (Sunday 6am UTC) + manual trigger via the Actions tab
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

# Required so the Action can commit the JSON back to the repo
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch 13F data from SEC
        run: node scripts/fetch-13f.js

      - name: Commit updated data
        run: |
          git config user.name "APEX Bot"
          git config user.email "actions@github.com"
          git add data/13f-holdings.json
          git diff --staged --quiet || git commit -m "Update 13F holdings $(date -u +%Y-%m-%d)"
          git push
